name: Collaborate Production CI & Security Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Build, Typecheck & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
        env:
          NEXT_PHASE: phase-production-build

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: API typecheck
        run: npx tsc --noEmit -p apps/api/tsconfig.json

      # In-process Fastify suites with isolated fixtures (fresh users, in-process admin
      # fixture). No demo credentials, no network, no external services.
      # The former steps ran `next start` (a gateway that needs COLLABORATE_BACKEND_URL)
      # and logged in with hardcoded demo passwords, which production now rejects.
      - name: Authorization, SSO and integration regression tests
        run: npm test
        env:
          COLLABORATE_ALLOW_LOCAL_STORAGE: 'true'
